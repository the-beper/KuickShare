name: Images

# The build images CI runs in: the same Containerfiles as the local build/build-env.sh, published to ghcr.io.

on:
  push:
    branches: [main]
    paths:
      - build/Containerfile
      - build/deb/Containerfile.ubuntu
      - build/flatpak/Containerfile
      - build/appimage/Containerfile.arch
      - .github/workflows/images.yml
  schedule:
    - cron: "17 4 * * 1" # weekly, to pick up Fedora, Ubuntu, Arch updates
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: kuickshare-build
            file: build/Containerfile
            context: build
            tag: fedora45
          - image: kuickshare-build
            file: build/deb/Containerfile.ubuntu
            context: build/deb
            tag: ubuntu26
          - image: kuickshare-flatpak
            file: build/flatpak/Containerfile
            context: build/flatpak
            tag: fedora45
          - image: kuickshare-appimage
            file: build/appimage/Containerfile.arch
            context: build/appimage
            tag: arch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only main publishes: the release builds in these images, and workflow_dispatch can start this from any branch.
      # Other refs build the image (a broken Containerfile still shows) and push nothing.
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          pull: true
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/the-beper/${{ matrix.image }}:${{ matrix.tag }}

      # The release workflow names these images by digest. This is the line to paste there (CONTRIBUTING.md, Pinned tools).
      - name: Digest
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/the-beper/${{ matrix.image }}:${{ matrix.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
