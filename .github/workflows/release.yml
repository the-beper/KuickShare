name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches Cargo.toml, CMakeLists.txt and the metainfo
        run: |
          v="${GITHUB_REF_NAME#v}"
          test "$(sed -n 's/^version = "\(.*\)"/\1/p;/^\[dependencies\]/q' Cargo.toml | head -1)" = "$v"
          test "$(sed -n 's/^project(kuickshare VERSION \([0-9.]*\).*/\1/p' src/shell/CMakeLists.txt)" = "$v"
          grep -q "<release version=\"$v\"" data/io.github.the_beper.KuickShare.metainfo.xml

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Build the AppImage and the tarball
        run: |
          build/build-appimage.sh
          build/build-tarball.sh

      - name: Check the tag matches the built version
        run: |
          test "$(sed -n 's/^project(kuickshare VERSION \([0-9.]*\).*/\1/p' src/shell/CMakeLists.txt)" = "${GITHUB_REF_NAME#v}"
          test -f dist/KuickShare-x86_64.AppImage
          test -f dist/KuickShare-x86_64.AppImage.zsync
          test -f dist/KuickShare-x86_64.tar.gz

      - name: Test
        run: |
          build/appimage/test-appimage.sh dist/KuickShare-x86_64.AppImage
          build/test-tarball.sh dist/KuickShare-x86_64.tar.gz

      - name: Checksum
        run: |
          cd dist
          sha256sum KuickShare-x86_64.AppImage KuickShare-x86_64.tar.gz > SHA256SUMS

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/KuickShare-x86_64.AppImage
            dist/KuickShare-x86_64.AppImage.zsync
            dist/KuickShare-x86_64.tar.gz
            dist/SHA256SUMS

  flatpak:
    needs: appimage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: read
    container:
      image: ghcr.io/the-beper/kuickshare-flatpak:fedora45
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged
    env:
      SITE_URL: https://the-beper.github.io/KuickShare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the published repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory '*'
          remote="https://x-access-token:$GH_TOKEN@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" gh-pages >/dev/null; then
            git clone --quiet --depth 1 --branch gh-pages "$remote" pages
          else
            mkdir pages
          fi

      - name: Import the signing key
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          test -n "$FLATPAK_GPG_PRIVATE_KEY" || { echo "secret FLATPAK_GPG_PRIVATE_KEY is not set (see CONTRIBUTING.md)"; exit 1; }
          printf '%s\n' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" >> "$GITHUB_ENV"

      - name: Build and sign
        run: |
          touch /run/.containerenv
          KUICKSHARE_FLATPAK_REPO="$PWD/pages/repo" build/flatpak/build-flatpak.sh --gpg-sign="$GPG_KEY_ID"

      - name: Finish the repository
        run: build/flatpak/publish-repo.sh pages "$SITE_URL"

      - name: Check the tag matches the built version
        run: |
          test "$(sed -n 's/^project(kuickshare VERSION \([0-9.]*\).*/\1/p' src/shell/CMakeLists.txt)" = "${GITHUB_REF_NAME#v}"
          test -f dist/KuickShare-x86_64.flatpak

      - name: Smoke test
        run: |
          mkdir -p -m 700 /run/user/0
          XDG_RUNTIME_DIR=/run/user/0 dbus-run-session -- build/flatpak/test-flatpak.sh dist/KuickShare-x86_64.flatpak

      - name: Publish to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd pages
          rm -rf .git repo/tmp
          git init --quiet --initial-branch=gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add --all
          git commit --quiet -m "Flatpak repository for ${GITHUB_REF_NAME}"
          git push --force "https://x-access-token:$GH_TOKEN@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/KuickShare-x86_64.flatpak
