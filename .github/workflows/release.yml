name: Release

# Pushing a tag vX.Y.Z builds, verifies, signs and publishes the release in separate jobs of one run, all for the same
# commit (github.sha). See CONTRIBUTING.md, Releases, for the order and for how to recover from a failed run.
#
#   validate        the tag names the version of the sources and the commit, which is on main
#   ci-gate         the CI run for that commit, pushed to main, finished green
#   build-*         build and test the AppImage, the tarball and the Flatpak. No secret, no write permission; the Flatpak
#                   commits are exported unsigned
#   verify          the exact set of files, their hashes, their version
#   prepare-flatpak the Flatpak repository on top of gh-pages, unsigned: everything that parses the build's output. No secret
#   sign-flatpak    the only job with the signing key (environment release-signing): checks what prepare made, then signs
#                   the listed commits and the summary and parses or generates nothing. Pushes nothing
#   finish-flatpak  another machine, no secret: checks the signed repository against the prepared one and as a client with
#                   only the public key, writes the site archive
#   publish         the only job with write permission: draft release, assets, gh-pages, then publishes the release.
#                   It rebuilds nothing and can be run again after a failure
on:
  push:
    tags: ["v*"]

permissions: {}

# One release at a time, and a running release is never cancelled (it may have written something already).
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SITE_URL: https://the-beper.github.io/KuickShare
  # The Rust of the tarball build, bumped by hand (CONTRIBUTING.md, Pinned tools). The Flatpak build uses the SDK extension at
  # the commit pinned in build/flatpak/build-flatpak.sh; the AppImage uses the Rust of its image.
  RUST_VERSION: "1.99.1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check the tag, the version and the commit
        id: check
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: build/release/check-version.sh

  # CI does not run on a tag. The release needs the CI run of the push of this very commit to main to have finished green
  # (the workflow run, whose result includes the `required` job). A check from a pull request run does not count: its
  # changes job may have skipped the packaging jobs.
  ci-gate:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for the CI run of this commit on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$(( $(date +%s) + 1200 ))
          while :; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&per_page=50" \
              --jq '.workflow_runs | sort_by(.id) | last | if . == null then "none" else "\(.status) \(.conclusion)" end')
            echo "CI run of the push of $GITHUB_SHA to main: $state"
            case $state in
              "completed success") exit 0 ;;
              "completed "*) echo "CI failed on this commit: fix it, push to main, and tag the new commit" >&2; exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "CI has no finished run for the push of this commit to main after 20 minutes: push the commit to main and wait for it, then run this job again" >&2
              exit 1
            fi
            sleep 30
          done

  build-appimage:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      appimage_sha256: ${{ steps.hash.outputs.appimage }}
      zsync_sha256: ${{ steps.hash.outputs.zsync }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # The Arch image published by images.yml (public, pulled without credentials), by digest: a release builds in the
      # image the repository names, not in whatever the tag points to now (bump: CONTRIBUTING.md, Pinned tools). A failed
      # pull fails the job.
      - name: Pull the build image
        run: |
          podman pull ghcr.io/the-beper/kuickshare-appimage:arch@sha256:61389bc5e90c7c859d9b4d13c5b0cf5bdee9e79f67010f510648ed75beaeddf7
          podman tag ghcr.io/the-beper/kuickshare-appimage:arch@sha256:61389bc5e90c7c859d9b4d13c5b0cf5bdee9e79f67010f510648ed75beaeddf7 localhost/kuickshare-appimage:arch

      - name: Build the AppImage
        run: build/build-appimage.sh

      - name: Test
        env:
          KUICKSHARE_EXPECT_VERSION: ${{ needs.validate.outputs.version }}
        run: build/appimage/test-appimage.sh dist/KuickShare-x86_64.AppImage

      - name: Hash
        id: hash
        run: |
          cd dist
          {
            echo "appimage=$(sha256sum KuickShare-x86_64.AppImage | cut -d' ' -f1)"
            echo "zsync=$(sha256sum KuickShare-x86_64.AppImage.zsync | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-appimage
          path: |
            dist/KuickShare-x86_64.AppImage
            dist/KuickShare-x86_64.AppImage.zsync
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  build-tarball:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      # By digest (bump: CONTRIBUTING.md, Pinned tools).
      image: ghcr.io/the-beper/kuickshare-build:fedora45@sha256:0da038b579457e83f700797c1344f5e7f3f608d06d49f5fd23c5d2ea842ec6e8
    outputs:
      tarball_sha256: ${{ steps.hash.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_VERSION"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # The scripts start the build container themselves unless they find /run/.containerenv: this job already runs in it.
      - name: Build and test the tarball
        env:
          KUICKSHARE_EXPECT_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          touch /run/.containerenv
          build/build-tarball.sh
          build/test-tarball.sh dist/KuickShare-x86_64.tar.gz

      - name: Hash
        id: hash
        run: echo "tarball=$(sha256sum dist/KuickShare-x86_64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-tarball
          path: dist/KuickShare-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # Builds the bundle and exports the commits WITHOUT a signature, onto an anonymous clone of the published repository (so that
  # they keep their parent). This job has no secret and no write token. It runs on the plain runner, not in a job container
  # (which would be a rootful, --privileged Docker container): the scripts start the build image with rootless podman, and
  # bubblewrap inside it needs /proc unmasked and the SYS_ADMIN and NET_ADMIN capabilities, inside the container's user
  # namespace only (build/flatpak/build-flatpak.sh). Pinned runner image, as the jobs that prepare, sign and finish the repository: the same podman, flatpak and ostree.
  build-flatpak:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      flatpak_sha256: ${{ steps.hash.outputs.flatpak }}
      commits_sha256: ${{ steps.hash.outputs.commits }}
      refs_sha256: ${{ steps.hash.outputs.refs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Anonymous: the repository is public. No gh-pages yet means the first release; any other failure fails the job.
      - name: Fetch the published repository
        run: |
          url="https://github.com/$GITHUB_REPOSITORY.git"
          heads=$(git ls-remote --heads "$url" gh-pages)
          if [ -n "$heads" ]; then
            git clone --quiet --depth 1 --branch gh-pages "$url" pages
          else
            mkdir pages
          fi

      # By digest (bump: CONTRIBUTING.md, Pinned tools). A failed pull fails the job.
      - name: Pull the build image
        run: |
          podman pull ghcr.io/the-beper/kuickshare-flatpak:fedora45@sha256:7090540522dbb23e1451fa5cd9c3e56dcbd4ace9f1ecf7080682bc89501e1e2e
          podman tag ghcr.io/the-beper/kuickshare-flatpak:fedora45@sha256:7090540522dbb23e1451fa5cd9c3e56dcbd4ace9f1ecf7080682bc89501e1e2e localhost/kuickshare-flatpak:fedora45

      - name: Build the Flatpak (unsigned)
        run: KUICKSHARE_FLATPAK_REPO="$PWD/pages/repo" build/flatpak/build-flatpak.sh

      - name: Smoke test
        env:
          KUICKSHARE_EXPECT_VERSION: ${{ needs.validate.outputs.version }}
        run: build/flatpak/test-flatpak.sh dist/KuickShare-x86_64.flatpak

      # ostree of the runner image, as in prepare-flatpak: the script only copies commits between repositories.
      - name: Export the new commits
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ostree
          build/release/export-flatpak-commits.sh pages dist/flatpak-commits

      - name: Hash
        id: hash
        run: |
          {
            echo "flatpak=$(sha256sum dist/KuickShare-x86_64.flatpak | cut -d' ' -f1)"
            echo "commits=$(sha256sum dist/flatpak-commits/flatpak-commits.tar | cut -d' ' -f1)"
            echo "refs=$(sha256sum dist/flatpak-commits/refs.txt | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-flatpak
          path: dist/KuickShare-x86_64.flatpak
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-commits
          path: dist/flatpak-commits/flatpak-commits.tar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # What the build says it exported, on its own: the signing job checks the sign list against it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-refs
          path: dist/flatpak-commits/refs.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  verify:
    needs: [validate, build-appimage, build-tarball, build-flatpak]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sums_sha256: ${{ steps.verify.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: asset-*
          merge-multiple: true
          path: release-assets

      - name: Verify the files and write SHA256SUMS
        id: verify
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECT_SHA256_APPIMAGE: ${{ needs.build-appimage.outputs.appimage_sha256 }}
          EXPECT_SHA256_ZSYNC: ${{ needs.build-appimage.outputs.zsync_sha256 }}
          EXPECT_SHA256_TARBALL: ${{ needs.build-tarball.outputs.tarball_sha256 }}
          EXPECT_SHA256_FLATPAK: ${{ needs.build-flatpak.outputs.flatpak_sha256 }}
        run: |
          build/release/verify-assets.sh release-assets
          echo "sums=$(sha256sum release-assets/SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # Everything that reads what the build made (the commits archive, ostree objects, appstream data) and everything that is
  # generated: the unsigned repository on top of gh-pages, its summary and appstream data, the list of refs to sign. No
  # environment, no secret (the script refuses to run with one), no write token. Pinned runner image, as the other Flatpak jobs:
  # the same flatpak and ostree, and CI's repo-update job proves client updates on that very image.
  prepare-flatpak:
    needs: [validate, build-flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      prepared_sha256: ${{ steps.prepare.outputs.prepared_sha256 }}
      signlist_sha256: ${{ steps.prepare.outputs.signlist_sha256 }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install flatpak and ostree
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak ostree appstream
          flatpak --version
          ostree --version | head -n 2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-commits
          path: flatpak-commits

      # GH_TOKEN is the read-only token of the job (contents: read): the script gives it to gh alone, to list the published releases.
      - name: Prepare the Flatpak repository (unsigned)
        id: prepare
        env:
          EXPECT_COMMITS_SHA256: ${{ needs.build-flatpak.outputs.commits_sha256 }}
          EXPECT_REFS_SHA256: ${{ needs.build-flatpak.outputs.refs_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: build/release/prepare-flatpak-repo.sh flatpak-commits/flatpak-commits.tar flatpak-prepared

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-prepared
          path: |
            flatpak-prepared/prepared.tar
            flatpak-prepared/sign-list.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # The only job that sees the signing key, and the only one with an environment. The environment release-signing must exist
  # with the secret FLATPAK_GPG_PRIVATE_KEY and a required reviewer (CONTRIBUTING.md, Releases, one-time setup): a job that
  # names an environment that does not exist makes GitHub create it unprotected, and then the repository secret of the same
  # name is readable here. The secret is given to one step only, which signs what the step before it checked and parses and
  # generates nothing. No --privileged: signing needs no sandbox.
  sign-flatpak:
    needs: [validate, ci-gate, verify, build-flatpak, prepare-flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-signing
    permissions:
      contents: read
    outputs:
      signed_sha256: ${{ steps.sign.outputs.signed_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # No container image here: the key is loaded where only GitHub's runner image and the distribution's signed packages
      # run. (The ghcr images are mutable tags; a build job's image is no place for the key.) Done before the secret exists.
      - name: Install flatpak and ostree
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak ostree
          flatpak --version
          ostree --version | head -n 2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-refs
          path: flatpak-refs

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-prepared
          path: flatpak-prepared

      # No secret: the hashes, gh-pages still at the base of the build, the archive and the list against refs.txt.
      - name: Check what prepare-flatpak made
        env:
          EXPECT_PREPARED_SHA256: ${{ needs.prepare-flatpak.outputs.prepared_sha256 }}
          EXPECT_SIGNLIST_SHA256: ${{ needs.prepare-flatpak.outputs.signlist_sha256 }}
          EXPECT_REFS_SHA256: ${{ needs.build-flatpak.outputs.refs_sha256 }}
          EXPECT_BASE_SHA: ${{ needs.prepare-flatpak.outputs.base_sha }}
        run: build/release/sign-flatpak-repo.sh --check flatpak-prepared/prepared.tar flatpak-prepared/sign-list.txt flatpak-refs/refs.txt "$RUNNER_TEMP/flatpak-sign-work"

      - name: Sign the Flatpak repository
        id: sign
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: build/release/sign-flatpak-repo.sh --sign "$RUNNER_TEMP/flatpak-sign-work" flatpak-signed

      - name: Remove the keyring and the work folder
        if: always()
        run: build/release/sign-flatpak-repo.sh --cleanup "$RUNNER_TEMP/flatpak-sign-work"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-signed
          path: flatpak-signed/signed-repo.tar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # No secret, another machine: trusts nothing the signing job returned. It checks that the signed repository is the prepared
  # one plus signatures, that a client with only the public key accepts it, and writes the site archive for publish.
  finish-flatpak:
    needs: [validate, build-flatpak, prepare-flatpak, sign-flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      site_sha256: ${{ steps.finish.outputs.site_sha256 }}
      base_sha: ${{ steps.finish.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install flatpak and ostree
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak ostree appstream
          flatpak --version
          ostree --version | head -n 2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-prepared
          path: flatpak-prepared

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-signed
          path: flatpak-signed

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-refs
          path: flatpak-refs

      - name: Check the signed repository and write the site
        id: finish
        env:
          EXPECT_PREPARED_SHA256: ${{ needs.prepare-flatpak.outputs.prepared_sha256 }}
          EXPECT_SIGNLIST_SHA256: ${{ needs.prepare-flatpak.outputs.signlist_sha256 }}
          EXPECT_SIGNED_SHA256: ${{ needs.sign-flatpak.outputs.signed_sha256 }}
          EXPECT_REFS_SHA256: ${{ needs.build-flatpak.outputs.refs_sha256 }}
          EXPECT_BASE_SHA: ${{ needs.prepare-flatpak.outputs.base_sha }}
        run: build/release/finish-flatpak-repo.sh flatpak-prepared/prepared.tar flatpak-prepared/sign-list.txt flatpak-signed/signed-repo.tar flatpak-refs/refs.txt flatpak-site

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-site
          path: flatpak-site/site.tar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # The only job with write permission. It uploads what verify and finish-flatpak produced and rebuilds nothing. Re-run it
  # ("Re-run failed jobs") after any failure: it does only what is missing.
  publish:
    needs: [validate, ci-gate, verify, finish-flatpak]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-site
          path: flatpak-site

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ASSETS_DIR: release-assets
          EXPECT_SUMS_SHA256: ${{ needs.verify.outputs.sums_sha256 }}
          SITE_TAR: flatpak-site/site.tar
          EXPECT_SITE_SHA256: ${{ needs.finish-flatpak.outputs.site_sha256 }}
          SITE_BASE_SHA: ${{ needs.finish-flatpak.outputs.base_sha }}
        run: build/release/publish.sh
