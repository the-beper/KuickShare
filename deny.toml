# Checked in CI with `cargo deny check`; locally: cargo install cargo-deny, then cargo deny check.

# The project is Linux only: leave the crates of other platforms out of the checks.
[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
# ksni (the tray) is on zbus 5, whose zbus_names, zvariant and zvariant_derive are now marked
# unmaintained: their code moved into zbus 6, which the core itself uses. No vulnerability is
# reported. Remove these entries when ksni moves to zbus 6 (0.3.7 is the newest).
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "unmaintained crate of zbus 5, only through ksni" },
    { id = "RUSTSEC-2026-0371", reason = "unmaintained crate of zbus 5, only through ksni" },
    { id = "RUSTSEC-2026-0372", reason = "unmaintained crate of zbus 5, only through ksni" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
# Upstream crates pull both RustCrypto generations, syn 2 and 3, and several getrandom versions: not ours to unify.
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
