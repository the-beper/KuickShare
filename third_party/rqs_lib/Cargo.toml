[package]
name = "rqs_lib"
version = "0.11.5"
edition = "2024"
authors = ["martichou"]
license = "GPL-3.0-only"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "core_bin"
path = "src/bin.rs"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["full"], optional = true }

[target.'cfg(all(target_arch = "aarch64", target_os = "linux"))'.dependencies]
dbus = { version = "0.9", features = ["vendored"] }

[dependencies]
anyhow = "1.0"
base64 = "0.23"
bytes = "1.10"
directories = "6.0"
futures = "0.3"
hex = "0.4"
hkdf = "0.13"
hmac = "0.13"
if-addrs = "0.15"
libaes = "0.7"
log = "0.4"
mdns-sd = "0.21"
mime_guess = "2.0"
num-bigint = "0.5"
once_cell = "1.20"
p256 = { version = "0.14", features = ["ecdh"] }
prost = "0.14"
rand = "0.10"
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.11"
tokio = { version = "1.54", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "sync",
    "time",
    "io-util",
    "signal",
] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1.15"

[build-dependencies]
prost-build = "0.14"

[features]
default = ["experimental"]
experimental = ["bluer"]

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
